<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROS SSH Terminal</title>
  <link rel="stylesheet" href="../fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../xterm.js/xterm.css">
  <link rel="stylesheet" href="terminal.css">
<link rel="stylesheet" href="../css/control-focus.css">
<script defer src="../js/styled-select.js"></script></head>
<body>
  <div class="terminal-app">
    <div class="terminal-toolbar">
      <div class="terminal-subtitle" id="terminalTargetLabel"></div>
      <div class="terminal-toolbar-actions">
        <button class="terminal-window-btn titlebar" id="hideTerminalBtn" type="button" aria-label="Hide terminal" tabindex="-1">
          <i class="fas fa-window-minimize"></i>
        </button>
        <button class="terminal-window-btn titlebar danger" id="closeTerminalBtn" type="button" aria-label="Close terminal" tabindex="-1">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <section class="terminal-shell" id="terminalShell"></section>
  </div>

  <script src="../xterm.js/xterm.js"></script>
  <script src="../xterm.js/xterm-addon-fit.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
